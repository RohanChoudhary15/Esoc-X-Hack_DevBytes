<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pothole Detection & Complaints Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- React and ReactDOM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.21.2/babel.min.js"></script>
    <!-- AOS Animation Library -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app-root"></div>
    {% raw %}
    <script type="text/babel">
        // Main App Component
        const App = () => {
            const [activeTab, setActiveTab] = React.useState('detection');
            const navbarRef = React.useRef(null);
            
            React.useEffect(() => {
                // Initialize AOS animations
                AOS.init({
                    duration: 1000,
                    once: true,
                    offset: 100
                });
                
                // Navbar scroll effect
                const handleScroll = () => {
                    if (navbarRef.current) {
                        if (window.scrollY > 10) {
                            navbarRef.current.classList.add('shadow-sm');
                        } else {
                            navbarRef.current.classList.remove('shadow-sm');
                        }
                    }
                };
                
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);
            
            const scrollToSection = (id) => {
                const element = document.getElementById(id);
                if (element) {
                    const offset = 100;
                    const elementPosition = element.getBoundingClientRect().top;
                    const offsetPosition = elementPosition + window.pageYOffset - offset;
                    
                    window.scrollTo({
                        top: offsetPosition,
                        behavior: 'smooth'
                    });
                }
            };
            
            return (
                <React.Fragment>
                    {/* Navigation */}
                    <nav className="navbar navbar-expand-lg navbar-light sticky-top" ref={navbarRef}>
                        <div className="container">
                            <a className="navbar-brand" href="#">
                                <i className="bi bi-cone-striped"></i>
                                PotholeAI
                            </a>
                            <button className="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                                <span className="navbar-toggler-icon"></span>
                            </button>
                            <div className="collapse navbar-collapse justify-content-end" id="navbarNav">
                                <ul className="navbar-nav">
                                    <li className="nav-item">
                                        <a className="nav-link active" href="#" onClick={() => scrollToSection('home')}>Home</a>
                                    </li>
                                    <li className="nav-item">
                                        <a className="nav-link" href="#" onClick={() => scrollToSection('features')}>Features</a>
                                    </li>
                                    <li className="nav-item">
                                        <a className="nav-link" href="#" onClick={() => scrollToSection('how-it-works')}>How It Works</a>
                                    </li>
                                    <li className="nav-item">
                                        <a className="nav-link" href="#" onClick={() => scrollToSection('tools-section')}>Tools</a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <section className="hero-section" id="home">
                        <div className="hero-bg">
                            <div className="hero-bg-circle circle-1"></div>
                            <div className="hero-bg-circle circle-2"></div>
                            <div className="hero-bg-circle circle-3"></div>
                        </div>
                        <div className="container">
                            <div className="row align-items-center">
                                <div className="col-lg-6 hero-content" data-aos="fade-right">
                                    <h1 className="hero-title text-white">Smart Pothole Detection & Civic Management</h1>
                                    <p className="hero-text text-white">
                                        AI-powered road safety and civic issue reporting system that helps create safer, 
                                        smarter cities through community participation and cutting-edge technology.
                                    </p>
                                    <div>
                                        <button className="btn hero-cta btn-light" onClick={() => scrollToSection('tools-section')}>
                                            Get Started
                                        </button>
                                        <button className="btn hero-cta btn-outline-light" onClick={() => scrollToSection('how-it-works')}>
                                            Learn More
                                        </button>
                                    </div>
                                </div>
                                <div className="col-lg-6 text-center" data-aos="fade-left">
                                    <img src="https://i.ibb.co/QvVmjZn7/file-00000000cb4861f79f918c1776f35c4b-conversation-id-67fd14ed-604c-800f-b5c5-ece049e0ec3f-message-i.png" alt="Pothole Detection Illustration" className="pothole-illustration" />
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Features Section */}
                    <section className="features-section" id="features">
                        <div className="container">
                            <div className="text-center mb-5" data-aos="fade-up">
                                <h2 className="display-5 fw-bold mb-3">Key Features</h2>
                                <p className="lead text-muted mx-auto" style={{maxWidth: "700px"}}>
                                    Our platform combines AI technology with community engagement to create safer roads and more responsive city services.
                                </p>
                            </div>

                            <div className="row">
                                <div className="col-md-4 mb-4" data-aos="fade-up" data-aos-delay="100">
                                    <div className="feature-card">
                                        <div className="feature-icon">
                                            <i className="bi bi-camera"></i>
                                        </div>
                                        <h3 className="feature-title">AI Pothole Detection</h3>
                                        <p className="feature-text">
                                            Advanced machine learning algorithms that can detect potholes from images with high accuracy and prioritize them based on severity.
                                        </p>
                                    </div>
                                </div>

                                <div className="col-md-4 mb-4" data-aos="fade-up" data-aos-delay="200">
                                    <div className="feature-card">
                                        <div className="feature-icon">
                                            <i className="bi bi-flag"></i>
                                        </div>
                                        <h3 className="feature-title">Civic Issue Reporting</h3>
                                        <p className="feature-text">
                                            Easy-to-use platform for citizens to report road conditions and other civic issues directly to municipal authorities.
                                        </p>
                                    </div>
                                </div>

                                <div className="col-md-4 mb-4" data-aos="fade-up" data-aos-delay="300">
                                    <div className="feature-card">
                                        <div className="feature-icon">
                                            <i className="bi bi-graph-up"></i>
                                        </div>
                                        <h3 className="feature-title">Real-time Analytics</h3>
                                        <p className="feature-text"> 
                                            Comprehensive dashboard showing critical statistics and trends to help authorities prioritize road maintenance efforts.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* How It Works */}
                    <section className="how-it-works" id="how-it-works">
                        <div className="container">
                            <div className="text-center mb-5" data-aos="fade-up">
                                <h2 className="display-5 fw-bold mb-3">How It Works</h2>
                                <p className="lead text-muted mx-auto" style={{maxWidth: "700px"}}>
                                    Our platform streamlines the process of detecting, reporting, and fixing road issues in just a few simple steps.
                                </p>
                            </div>

                            <div className="row justify-content-center">
                                <div className="col-lg-8">
                                    <div className="step-card" data-aos="fade-up" data-aos-delay="100">
                                        <div className="step-number">1</div>
                                        <div className="step-content">
                                            <h4>Take a Photo</h4>
                                            <p>Capture an image of the pothole or road damage using your smartphone or camera.</p>
                                        </div>
                                    </div>

                                    <div className="step-card" data-aos="fade-up" data-aos-delay="200">
                                        <div className="step-number">2</div>
                                        <div className="step-content">
                                            <h4>Upload for Analysis</h4>
                                            <p>Upload the image to our AI system which will detect and classify the severity of the pothole.</p>
                                        </div>
                                    </div>

                                    <div className="step-card" data-aos="fade-up" data-aos-delay="300">
                                        <div className="step-number">3</div>
                                        <div className="step-content">
                                            <h4>Submit a Complaint</h4>
                                            <p>File a formal complaint with location details that will be forwarded to the relevant authorities.</p>
                                        </div>
                                    </div>

                                    <div className="step-card" data-aos="fade-up" data-aos-delay="400">
                                        <div className="step-number">4</div>
                                        <div className="step-content">
                                            <h4>Track Progress</h4>
                                            <p>Monitor the status of your complaint and receive updates when the issue is addressed.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Tools Section */}
                    <section className="container" id="tools-section">
                        <div className="text-center mb-5" data-aos="fade-up">
                            <h2 className="display-5 fw-bold mb-3">Our Tools</h2>
                            <p className="lead text-muted mx-auto" style={{maxWidth: "700px"}}>
                                Access our pothole detection algorithm and civic complaint system to help improve road conditions in your area.
                            </p>
                            
                            <div className="content-tabs d-inline-flex">
                                <div 
                                    className={`content-tab ${activeTab === 'detection' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('detection')}
                                >
                                    <i className="bi bi-search me-2"></i>
                                    Pothole Detection
                                </div>
                                <div 
                                    className={`content-tab ${activeTab === 'complaint' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('complaint')}
                                >
                                    <i className="bi bi-flag-fill me-2"></i>
                                    Raise Complaint
                                </div>
                            </div>
                        </div>

                        {/* Stats Card */}
                        <div className="row mb-4" data-aos="fade-up">
                            <div className="col-lg-8 mx-auto">
                                <div className="stats-card">
                                    <div className="card-body p-0">
                                        <h4 className="card-title mb-3"><i className="bi bi-bar-chart-fill me-2"></i>Pothole Detection Stats</h4>
                                        <div className="row text-center">
                                            <div className="col-6 col-md-3 mb-2">
                                                <span className="stat-label">Total</span>
                                                <div className="stat-value" id="stat-total"></div>
                                            </div>
                                            <div className="col-6 col-md-3 mb-2">
                                                <span className="stat-label text-danger"><i className="bi bi-exclamation-triangle-fill"></i> High</span>
                                                <div className="stat-value badge bg-danger" id="stat-high"></div>
                                            </div>
                                            <div className="col-6 col-md-3 mb-2">
                                                <span className="stat-label text-warning"><i className="bi bi-exclamation-circle-fill"></i> Medium</span>
                                                <div className="stat-value badge bg-warning text-dark" id="stat-medium"></div>
                                            </div>
                                            <div className="col-6 col-md-3 mb-2">
                                            <span className="stat-label text-success"><i className="bi bi-check-circle-fill"></i> Low</span>
                                            <div className="stat-value badge bg-success" id="stat-low"></div>
                                        </div>
                                    </div>
                                    <div className="text-end text-muted mt-2"><small>Last Updated: <span id="stat-updated"></span></small></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {activeTab === 'detection' && (
                        <div className="row mb-5" data-aos="fade-up">
                            <div className="col-lg-8 mx-auto">
                                <div className="card shadow">
                                    <div className="card-body">
                                        <h3 className="card-title"><i className="bi bi-search me-2"></i>Pothole Detection</h3>
                                        <form id="pothole-form" encType="multipart/form-data" autoComplete="off">
                                            <div className="mb-3">
                                                <label htmlFor="image" className="form-label">Upload Road Image</label>
                                                <input className="form-control" type="file" id="image" name="image" accept="image/*" required />
                                                <div className="form-text">Supported formats: JPG, PNG, WebP</div>
                                            </div>
                                            <button type="submit" className="btn btn-primary">
                                                <i className="bi bi-search me-2"></i> Check for Pothole
                                            </button>
                                            <div id="pothole-loading" className="mt-3" style={{display:'none'}}>
                                                <div className="spinner-border text-primary" role="status"></div>
                                                <span className="ms-2">Detecting potholes...</span>
                                            </div>
                                        </form>
                                        <div id="result-section" className="mt-4" style={{display:'none'}}>
                                            <h5>Detection Result</h5>
                                            <pre id="result-json" className="bg-light p-2 rounded"></pre>
                                            <h6>Annotated Image</h6>
                                            <img id="annotated-image" src="" alt="Annotated Result" className="img-fluid border rounded shadow-sm" />
                                        </div>
                                        <div id="error-section" className="alert alert-danger mt-4" style={{display:'none'}}></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'complaint' && (
                        <div className="row mb-5" data-aos="fade-up">
                            <div className="col-lg-8 mx-auto">
                                <div className="card shadow">
                                    <div className="card-body">
                                        <h3 className="card-title"><i className="bi bi-flag-fill me-2"></i>Raise Civic Complaint</h3>
                                        <form id="complaint-form" encType="multipart/form-data" autoComplete="off">
                                            <div className="mb-3">
                                                <label htmlFor="complaint-text" className="form-label">Complaint Description</label>
                                                <textarea className="form-control" id="complaint-text" name="text" rows="2" required placeholder="Describe the issue..."></textarea>
                                            </div>
                                            <div className="mb-3">
                                                <label htmlFor="issue-type" className="form-label">Issue Type</label>
                                                <input className="form-control" type="text" id="issue-type" name="issue_type" placeholder="e.g. pothole" required />
                                            </div>
                                            <div className="row">
                                                <div className="col-md-6 mb-3">
                                                    <label className="form-label">Street Name</label>
                                                    <input className="form-control" type="text" id="street" name="street" required />
                                                </div>
                                                <div className="col-md-6 mb-3">
                                                    <label className="form-label">City Name</label>
                                                    <input className="form-control" type="text" id="city" name="city" required />
                                                </div>
                                            </div>
                                            <div className="row">
                                                <div className="col-md-6 mb-3">
                                                    <label className="form-label">State</label>
                                                    <input className="form-control" type="text" id="state" name="state" required />
                                                </div>
                                                <div className="col-md-6 mb-3">
                                                    <label className="form-label">ZipCode</label>
                                                    <input className="form-control" type="text" id="zipcode" name="zipcode" required />
                                                </div>
                                            </div>
                                            <div className="mb-3">
                                                <label htmlFor="complaint-image" className="form-label">Upload Image</label>
                                                <input className="form-control" type="file" id="complaint-image" name="image" accept="image/*" required />
                                                <div className="form-text">Supported formats: JPG, PNG, WebP</div>
                                            </div>
                                            <button type="submit" className="btn btn-success">
                                                <i className="bi bi-flag-fill me-2"></i> Submit Complaint
                                            </button>
                                            <div id="complaint-loading" className="mt-3" style={{display:'none'}}>
                                                <div className="spinner-border text-success" role="status"></div>
                                                <span className="ms-2">Submitting complaint...</span>
                                            </div>
                                        </form>
                                        <div id="complaint-result-section" className="mt-4" style={{display:'none'}}>
                                            <div className="alert alert-info d-flex align-items-center" role="alert">
                                                <i className="bi bi-info-circle-fill me-2"></i>
                                                <div id="complaint-result-message"></div>
                                            </div>
                                        </div>
                                        <div id="complaint-error-section" className="alert alert-danger mt-4" style={{display:'none'}}></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </section>

                {/* Testimonial Section */}
                <section className="container mb-5" data-aos="fade-up">
                    <div className="text-center mb-5">
                        <h2 className="display-5 fw-bold mb-3">What Users Say</h2>
                        <p className="lead text-muted mx-auto" style={{maxWidth: "700px"}}>
                            Hear from citizens and municipal workers who use our platform to improve their communities.
                        </p>
                    </div>
                    
                    <div className="row">
                        <div className="col-md-4 mb-4" data-aos="fade-up" data-aos-delay="100">
                            <div className="card h-100">
                                <div className="card-body">
                                    <div className="mb-3">
                                        <i className="bi bi-star-fill text-warning"></i>
                                        <i className="bi bi-star-fill text-warning"></i>
                                        <i className="bi bi-star-fill text-warning"></i>
                                        <i className="bi bi-star-fill text-warning"></i>
                                        <i className="bi bi-star-fill text-warning"></i>
                                    </div>
                                    <p className="card-text">"As a city maintenance worker, this platform has revolutionized how we prioritize road repairs. The AI detection is surprisingly accurate!"</p>
                                    <div className="d-flex align-items-center mt-3">
                                        <div className="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style={{width: "50px", height: "50px"}}>
                                            <i className="bi bi-person-fill"></i>
                                        </div>
                                        <div className="ms-3">
                                            <h6 className="mb-0">Robert Chen</h6>
                                            <small className="text-muted">City Maintenance Dept.</small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div className="col-md-4 mb-4" data-aos="fade-up" data-aos-delay="200">
                            <div className="card h-100">
                                <div className="card-body">
                                    <div className="mb-3">
                                        <i className="bi bi-star-fill text-warning"></i>
                                        <i className="bi bi-star-fill text-warning"></i>
                                        <i className="bi bi-star-fill text-warning"></i>
                                        <i className="bi bi-star-fill text-warning"></i>
                                        <i className="bi bi-star-fill text-warning"></i>
                                    </div>
                                    <p className="card-text">"I reported a pothole near my home and it was fixed within a week! The process was simple and straightforward. Great civic tool!"</p>
                                    <div className="d-flex align-items-center mt-3">
                                        <div className="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style={{width: "50px", height: "50px"}}>
                                            <i className="bi bi-person-fill"></i>
                                        </div>
                                        <div className="ms-3">
                                            <h6 className="mb-0">Sarah Johnson</h6>
                                            <small className="text-muted">Community Member</small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div className="col-md-4 mb-4" data-aos="fade-up" data-aos-delay="300">
                            <div className="card h-100">
                                <div className="card-body">
                                    <div className="mb-3">
                                        <i className="bi bi-star-fill text-warning"></i>
                                        <i className="bi bi-star-fill text-warning"></i>
                                        <i className="bi bi-star-fill text-warning"></i>
                                        <i className="bi bi-star-fill text-warning"></i>
                                        <i className="bi bi-star-half text-warning"></i>
                                    </div>
                                    <p className="card-text">"As a transportation planner, the data analytics this platform provides helps us make informed decisions about infrastructure improvements."</p>
                                    <div className="d-flex align-items-center mt-3">
                                        <div className="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style={{width: "50px", height: "50px"}}>
                                            <i className="bi bi-person-fill"></i>
                                        </div>
                                        <div className="ms-3">
                                            <h6 className="mb-0">Michael Torres</h6>
                                            <small className="text-muted">City Planner</small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                {/* Footer */}
                <footer>
                    <div className="container">
                        <div className="row">
                            <div className="col-lg-4 mb-4">
                                <div className="footer-brand">
                                    <i className="bi bi-cone-striped"></i>
                                    PotholeAI
                                </div>
                                <p className="footer-text">
                                    AI-powered road safety and civic issue reporting for smarter cities.
                                    Building better communities through technology and citizen participation.
                                </p>
                                <div className="social-links">
                                    <a href="#" className="social-link"><i className="bi bi-facebook"></i></a>
                                    <a href="#" className="social-link"><i className="bi bi-twitter"></i></a>
                                    <a href="#" className="social-link"><i className="bi bi-instagram"></i></a>
                                    <a href="#" className="social-link"><i className="bi bi-linkedin"></i></a>
                                </div>
                            </div>
                            
                            <div className="col-lg-2 col-md-4 mb-4">
                                <div className="footer-links">
                                    <h5>Navigation</h5>
                                    <ul>
                                        <li><a href="#" onClick={() => scrollToSection('home')}>Home</a></li>
                                        <li><a href="#" onClick={() => scrollToSection('features')}>Features</a></li>
                                        <li><a href="#" onClick={() => scrollToSection('how-it-works')}>How It Works</a></li>
                                        <li><a href="#" onClick={() => scrollToSection('tools-section')}>Tools</a></li>
                                    </ul>
                                </div>
                            </div>
                            
                            <div className="col-lg-3 col-md-4 mb-4">
                                <div className="footer-links">
                                    <h5>Resources</h5>
                                    <ul>
                                        <li><a href="#">API Documentation</a></li>
                                        <li><a href="#">Developer Resources</a></li>
                                        <li><a href="#">Data Privacy</a></li>
                                        <li><a href="#">Terms of Service</a></li>
                                    </ul>
                                </div>
                            </div>
                            
                            <div className="col-lg-3 col-md-4 mb-4">
                                <div className="footer-links">
                                    <h5>Contact</h5>
                                    <ul>
                                        <li><a href="#"><i className="bi bi-envelope me-2"></i>info@potholeai.com</a></li>
                                        <li><a href="#"><i className="bi bi-telephone me-2"></i>(555) 123-4567</a></li>
                                        <li><a href="#"><i className="bi bi-geo-alt me-2"></i>123 Tech Lane, Smart City</a></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                        
                        <div className="copyright">
                            <small>
                                <i className="bi bi-c-circle"></i> 2025 Smart City Hackathon | Built with Flask, React, Bootstrap, and AI
                            </small>
                        </div>
                    </div>
                </footer>
            </React.Fragment>
        );
    }

    // Render App component
    ReactDOM.render(<App />, document.getElementById('app-root'));
</script>
{% endraw %}
<!-- Original JS logic - preserved and not modified -->
<script src="/static/app.js"></script>

</body>
</html>
